<!DOCTYPE html>
<!--
  GitHub Pages SPA redirect — place this file as "404.html" at the ROOT of your
  techpromux.github.io repository (not inside apps/mydeviceinfo/).

  How it works:
    1. GitHub Pages serves this file whenever a URL like
       https://techpromux.github.io/apps/mydeviceinfo/device is not found.
    2. This script encodes the intended path as a ?r= query parameter and
       redirects to the Angular app root (/apps/mydeviceinfo/?r=...).
    3. The Angular app's index.html reads ?r= synchronously (before Angular
       boots) and calls history.replaceState so the router starts at the
       correct page — no double-navigation, no dashboard flash.

  If you host other apps in other sub-paths, add them to the SPA_BASES list below.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var SPA_BASES = [
        '/apps/mydeviceinfo/'
      ];

      var path = location.pathname;

      var base = null;
      for (var i = 0; i < SPA_BASES.length; i++) {
        if (path.startsWith(SPA_BASES[i]) || path === SPA_BASES[i].replace(/\/$/, '')) {
          base = SPA_BASES[i];
          break;
        }
      }

      if (base) {
        // Encode the target path (relative to root) as ?r= and redirect to the SPA root.
        // index.html restores it via history.replaceState before Angular boots.
        var target = path + location.search;
        location.replace(
          location.origin + base + '?r=' + encodeURIComponent(target) + location.hash
        );
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;color:#64748b;text-align:center;margin-top:3rem;">
    Redirecting…
  </p>
</body>
</html>
