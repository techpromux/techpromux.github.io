<!DOCTYPE html>
<!--
  GitHub Pages SPA redirect — place this file as "404.html" at the ROOT of your
  techpromux.github.io repository (not inside apps/mydeviceinfo/).

  How it works:
    1. GitHub Pages serves this file whenever a URL like
       https://techpromux.github.io/apps/mydeviceinfo/device is not found.
    2. This script saves the full URL in sessionStorage and redirects to the
       Angular app root (/apps/mydeviceinfo/).
    3. The Angular app's index.html reads the saved URL before Angular boots
       and uses history.replaceState so the router navigates to the right page.

  If you host other apps in other sub-paths, add them to the SPA_BASES list below.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      // Sub-paths that contain Angular SPAs — extend this list as needed
      var SPA_BASES = [
        '/apps/mydeviceinfo/'
      ];

      var path = location.pathname;

      // Find the matching SPA base for the current path
      var base = null;
      for (var i = 0; i < SPA_BASES.length; i++) {
        if (path.startsWith(SPA_BASES[i]) || path === SPA_BASES[i].replace(/\/$/, '')) {
          base = SPA_BASES[i];
          break;
        }
      }

      if (base) {
        // Save the intended destination and bounce to the SPA root
        sessionStorage.setItem('spa:redirect', JSON.stringify({
          path: path,
          search: location.search,
          hash: location.hash
        }));
        location.replace(location.origin + base);
      }
      // If no matching SPA, leave the page as-is (GitHub's default 404 content)
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;color:#64748b;text-align:center;margin-top:3rem;">
    Redirecting…
  </p>
</body>
</html>
