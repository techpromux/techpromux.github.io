<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechPromux Labs</title>
  <meta name="description" content="Open-source web &amp; mobile apps built with Angular and Capacitor." />
  <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#3730A3" media="(prefers-color-scheme: dark)" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --text:      #0f172a;
      --muted:     #64748b;
      --accent:    #4f46e5;
      --accent2:   #7c3aed;
      --tag-bg:    #ede9fe;
      --tag-color: #5b21b6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0f172a;
        --surface:   #1e293b;
        --border:    #334155;
        --text:      #f1f5f9;
        --muted:     #94a3b8;
        --accent:    #818cf8;
        --accent2:   #a78bfa;
        --tag-bg:    #312e81;
        --tag-color: #c4b5fd;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 2.5rem 1.5rem 0;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    /* ── Grid ── */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1.25rem 1rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(79, 70, 229, 0.18);
      border-color: var(--accent);
    }

    .card:hover::before { opacity: 0.04; }

    .card-head {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      position: relative;
    }

    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .card-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      position: relative;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      position: relative;
    }

    .tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-color);
    }

    .open-link {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .open-link svg {
      width: 11px;
      height: 11px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-name">TechPromux Labs</span>
    </div>
    <p class="tagline">Open-source apps built with Angular &amp; Capacitor</p>
  </header>

  <main>
    <p class="section-label">Apps</p>
    <div class="grid">

      <a class="card" href="./apps/mydeviceinfo/">
        <div class="card-head">
          <div class="card-icon" style="background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="5" y="1" width="14" height="22" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
              <rect x="7" y="4" width="10" height="13" rx="1" fill="currentColor" opacity="0.25"/>
              <circle cx="12" cy="20" r="1" fill="currentColor"/>
              <circle cx="12" cy="7.5" r="1" fill="currentColor"/>
              <line x1="12" y1="9.5" x2="12" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="card-title">My Device Info</span>
        </div>
        <p class="card-desc">Complete device diagnostics — display, battery, network, sensors, storage and more. 100% local, no telemetry.</p>
        <div class="card-footer">
          <span class="tag">Angular</span>
          <span class="tag">Capacitor</span>
          <span class="tag">PWA</span>
          <span class="open-link">
            Open
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M1 11L11 1M11 1H4.5M11 1V7.5"/>
            </svg>
          </span>
        </div>
      </a>

    </div>
  </main>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> TechPromux &mdash;
    <a href="https://github.com/techpromux" target="_blank" rel="noopener">GitHub</a>
  </footer>

</body>
</html>
