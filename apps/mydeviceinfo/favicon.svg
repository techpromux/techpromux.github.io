<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Phone body -->
  <rect x="19" y="9" width="26" height="46" rx="4" fill="rgba(255,255,255,0.9)"/>

  <!-- Screen area -->
  <rect x="21.5" y="13.5" width="21" height="37" rx="2.5" fill="rgba(79,70,229,0.12)"/>

  <!-- Camera pill -->
  <rect x="27" y="11" width="10" height="2.5" rx="1.25" fill="rgba(79,70,229,0.3)"/>

  <!-- Info "i" circle -->
  <circle cx="32" cy="32" r="7" fill="#4F46E5"/>

  <!-- i dot -->
  <circle cx="32" cy="28.5" r="1.25" fill="white"/>

  <!-- i stem -->
  <rect x="30.75" y="30.5" width="2.5" height="6" rx="1.25" fill="white"/>

  <!-- Home bar -->
  <rect x="27.5" y="51" width="9" height="1.5" rx="0.75" fill="rgba(79,70,229,0.35)"/>
</svg>
